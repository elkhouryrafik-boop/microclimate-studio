# Weather library manifest.
#
# The five TMYx entries are REFERENCES to public stations on Climate.OneBuilding.org:
# the .epw files are not in this repository. `python scripts/fetch_weather.py --all` downloads each zip from
# `source_url`, extracts the .epw and verifies `sha256` (of the .epw bytes) before writing weather_data/<filename>
# (git-ignored). Station id, latitude, longitude, elevation, time zone and data period were parsed from the header
# of the downloaded .epw. The `synthetic` entry is generated by examples/make_sample.py and is the only file used
# by tests and the demo. See docs/weather-library.md for the provenance chain and the quality-score rubric.
